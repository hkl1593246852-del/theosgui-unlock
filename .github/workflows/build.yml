name: build-dylib
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils clang lld llvm
      - name: Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $HOME/theos/sdks && cp -r /tmp/sdks/iPhoneOS*.sdk $HOME/theos/sdks/
          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          for t in clang clang++ ld.lld lld; do ln -sf $(which $t) $HOME/theos/toolchain/linux/iphone/bin/$t; done
          for t in lipo ar ranlib strip; do ln -sf /usr/bin/llvm-$t $HOME/theos/toolchain/linux/iphone/bin/$t; done
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: |
          export PATH=$THEOS/bin:$HOME/theos/toolchain/linux/iphone/bin:$PATH
          make
      - name: Collect
        run: |
          mkdir -p out
          find .theos -type f -name '*.dylib' -exec cp -v {} out/ \;
          ls -la out || true
      - uses: actions/upload-artifact@v4
        with:
          name: theosgui-unlock
          path: out/
          if-no-files-found: warn
